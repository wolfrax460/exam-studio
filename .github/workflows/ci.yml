name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    # MongoDB 8.0 cannot start on the 6.19 kernel used by the Ubuntu 24.04 runner.
    runs-on: ubuntu-22.04
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
            apps/landing/package-lock.json
      - run: |
          npm --prefix server ci
          npm --prefix client ci
          npm --prefix apps/landing ci
      - name: Test API against disposable local databases
        working-directory: server
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017
        run: node --test --test-concurrency=3 --test-timeout=90000 test/*.test.js
      - name: Test institution people management in JSON storage
        working-directory: server
        env:
          TASK023_TEST_FILE_MODE: "1"
        run: node --test --test-timeout=90000 test/institution-people.test.js test/institution-courses.test.js
      - name: Test client
        working-directory: client
        run: node --test test/*.test.js
      - run: npm run build
      - name: Install Chromium for institution entry tests
        working-directory: client
        run: npm exec -- playwright install --with-deps chromium
      - name: Test institution entry in Chromium
        working-directory: client
        run: npm run test:institution-entry
      - run: npm --prefix apps/landing run build
